/* ============================================================ LOCKS
   A screen does not open until the work on it is actually done, and the beat
   does not end before its time. Back is always allowed; forward is earned. */
function nCheck(re){ return Object.keys(S.checks).filter(k=>re.test(k)&&S.checks[k]).length; }
function confirmBtn(k,off,on){
  return `<div class="btnrow"><button class="btn ${S.confirms[k]?'':'primary'} wide"
    data-act="confirm" data-k="${k}">${S.confirms[k]?'✓ '+on:off}</button></div>`;
}
function needsFor(id){
  const L=S.ladder, F=S.fill;
  switch(id){
   case 'setup':   return [{t:'Set where you are, or skip it deliberately', ok:S.geoDecided||S.lat!==null}];
   case 'relay':   return [{t:'Find your own line in the list', ok:!!S.confirms.relay}];
   case 'ready':   return [{t:'Materials for the hour — all eight', ok:nCheck(/^h\d/)===8},
                           {t:'Materials for the boat — all seven', ok:nCheck(/^b\d/)===7},
                           {t:'The safety gate — all six', ok:nCheck(/^g\d/)===6}];
   case 'build':   return [{t:'All five build steps done', ok:nCheck(/^B\d/)===5}];
   case 'open':    return [{t:'Say the line aloud', ok:!!S.confirms.open}];
   case 'ward':    return [{t:'Circle cast', ok:!!S.confirms.cast},
                           {t:'Hand physically on your water', ok:!!S.confirms.water}];
   case 'call':    return [{t:'All eight called', ok:Object.keys(S.called).filter(k=>S.called[k]).length===8}];
   case 'name':    return [{t:'All six rungs written', ok:LADDER.every(r=>(L[r.k]||'').trim())},
                           {t:'Copied onto the parchment in your own hand', ok:!!S.confirms.parch}];
   case 'cord':    return [{t:'Cut or untie chosen', ok:!!S.cordMode},
                           {t:'Both ends named', ok:!!(S.cordEnds.a||'').trim()&&!!(S.cordEnds.b||'').trim()},
                           {t:'The cord is parted', ok:!!S.confirms.cord}];
   case 'burn':    return [{t:'Read aloud before it went in', ok:!!S.confirms.read},
                           {t:'It is ash — and fully out', ok:!!S.checks.burned}];
   case 'fill':    return [{t:'All four lines filled', ok:!!(F.space||'').trim()&&!!(F.into||'').trim()&&!!(F.feed||'').trim()&&!!F.when},
                           {t:'Said out loud', ok:!!S.confirms.fill}];
   case 'boatwrite':return[{t:'Farewell written on the paper', ok:!!S.farewell.trim()},
                           {t:'Inside or outside chosen', ok:!!S.checks.side},
                           {t:'Bound — all four', ok:nCheck(/^W\d/)===4}];
   case 'launch':  return [{t:'It is eight o’clock where you are', ok:Date.now()>=myLaunch().getTime(), clock:'launch'},
                           {t:'Lit', ok:S.lit},
                           {t:'One push given, hands off', ok:S.pushed}];
   case 'close':   return [{t:'All eight thanked and released', ok:nCheck(/^R/)===8}];
   case 'sitting': {const dk=darkToday();
                    return [{t:'It is dark where you are', ok:S.lat===null?true:(dk?Date.now()>=dk.getTime():true), clock:'dark'},
                            {t:'Sat with it — looked, did not touch', ok:S.sat}];}
  }
  return [];
}
/* seconds still owed to this beat */
function timeOwed(){
  const st=STEPS[S.step];
  if(S.preview||!st.mins||S.timerDone[st.id]) return 0;
  return tLeft();
}
function gateState(){
  const st=STEPS[S.step];
  const need=S.preview?[]:needsFor(st.id);
  const undone=need.filter(n=>!n.ok);
  return {need, undone, owed:timeOwed(), open:undone.length===0 && timeOwed()===0};
}
function gatePanelHTML(){
  const g=gateState(), st=STEPS[S.step];
  if(S.preview) return `<div class="gatep preview"><h4>Preview mode — locks are off</h4>
    <p style="margin:0" class="tiny">Tap the step counter three times to put them back on.</p></div>`;
  if(!g.need.length && !st.mins) return '';
  const rows=g.need.map(n=>`<div class="gr ${n.ok?'ok':''}"><span class="gb">${n.ok?'✓':'○'}</span>
    <span>${esc(n.t)}</span>${n.clock?`<em class="gclock" data-clock="${n.clock}"></em>`:''}</div>`).join('');
  const t = st.mins? `<div class="gr ${timeOwed()===0?'ok':''}" id="grTime"><span class="gb">${timeOwed()===0?'✓':'○'}</span>
    <span>Stay with this beat</span><em class="gclock" id="gtLeft"></em></div>` : '';
  return `<div class="gatep ${g.open?'open':''}">
    <h4>${g.open?'This screen is open':'This screen is holding'}</h4>
    ${rows}${t}
    ${g.open?'<p class="tiny" style="margin:10px 0 0">Take longer if the room needs it. Continue when you are ready.</p>':''}
  </div>`;
}
function updateGateUI(){
  const g=gateState(), st=STEPS[S.step], nx=$('#btnNext');
  const last=S.step===STEPS.length-1;
  nx.disabled=!g.open;
  nx.classList.toggle('locked',!g.open);
  if(g.open){ nx.textContent = last ? 'Begin again' : 'Continue →'; }
  else if(g.undone.length){ nx.textContent = '🔒 '+g.undone.length+' still to do'; }
  else { nx.textContent = '🔒 '+dur(g.owed*1000); }
  const gt=$('#gtLeft'); if(gt) gt.textContent = timeOwed()>0 ? dur(timeOwed()*1000)+' left' : 'done';
  const rt=$('#grTime'); if(rt){ rt.classList.toggle('ok',timeOwed()===0);
    rt.querySelector('.gb').textContent = timeOwed()===0?'✓':'○'; }
  document.querySelectorAll('.gclock[data-clock]').forEach(el=>{
    if(el.dataset.clock==='launch'){ const d=myLaunch()-Date.now();
      el.textContent = d>0 ? dur(d) : 'now'; }
    if(el.dataset.clock==='dark'){ const dk=darkToday();
      if(!dk){el.textContent='—';return;} const d=dk-Date.now();
      el.textContent = d>0 ? dur(d) : 'now'; }
  });
}

/* ============================================================ ENGINE */
let tickers={};
/* render(true) = a "soft" redraw after ticking a box or typing: it keeps your
   scroll position and does not touch a running timer. Only moving between
   steps scrolls back to the top. */
function render(soft){
  const y = soft ? window.scrollY : 0;
  const af = soft ? ' style="animation:none"' : '';
  tickers={};
  const st=STEPS[S.step];
  $('#stage').innerHTML=`<div class="screen"${af}>${st.render()}${gatePanelHTML()}</div>`;
  $('#brandsub').textContent=st.name;
  $('#stepno').textContent=(S.step+1)+' / '+STEPS.length+(S.preview?' ·P':'');
  $('#progbar').style.width=((S.step)/(STEPS.length-1)*100)+'%';
  $('#btnBack').style.visibility=S.step===0?'hidden':'visible';
  if(st.mount) st.mount();
  if(!soft) setupTimer(st.mins||0);
  updateGateUI();
  tick();
  window.scrollTo(0,y);
  save();
}
function go(n){
  if(n>S.step){
    const g=gateState();
    if(!g.open){
      flash(g.undone.length ? 'Not yet — '+g.undone[0].t.toLowerCase() : 'Not yet — '+dur(g.owed*1000)+' still owed to this beat');
      const p=document.querySelector('.gatep'); if(p) p.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  S.step=Math.max(0,Math.min(STEPS.length-1,n));
  S.reached=Math.max(S.reached||0,S.step);
  render();
}
function flash(msg){
  let el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--botH) + 18px);z-index:95;background:#d4635a;color:#fff;padding:11px 18px;border-radius:3px;font-family:var(--sans);font-size:12.5px;letter-spacing:.05em;box-shadow:0 8px 26px rgba(0,0,0,.5)';
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

/* ---- timer ---- */
/* Wall-clock, not a decrementing counter: browsers throttle background tabs to
   about one tick a minute, so a counting-down number would stall the moment
   somebody checked their phone. This measures elapsed real time instead. */
let T={total:0,endAt:0,held:0,run:false,iv:null};
function tLeft(){
  if(T.total<=0) return 0;
  return T.run ? Math.max(0,Math.ceil((T.endAt-Date.now())/1000)) : T.held;
}
function setupTimer(mins){
  clearInterval(T.iv); T.iv=null; T.run=false;
  const st=STEPS[S.step];
  const served = S.preview || S.timerDone[st.id];
  T.total=mins*60; T.held=served?0:T.total; T.endAt=0;
  $('#timerbox').style.display = mins>0 ? 'flex':'none';
  $('#timerbox').classList.remove('run'); $('#tPlay').textContent='▶';
  drawTimer();
  if(mins>0 && !served) startTimer();   // the beat begins the moment you arrive
}
function drawTimer(){
  const v=tLeft(), m=Math.floor(v/60), s=v%60;
  $('#tDisp').textContent=m+':'+String(s).padStart(2,'0');
}
function startTimer(){
  if(T.run||T.held<=0) return;
  T.run=true; T.endAt=Date.now()+T.held*1000;
  $('#tPlay').textContent='❚❚'; $('#timerbox').classList.add('run');
  clearInterval(T.iv);
  T.iv=setInterval(()=>{
    drawTimer(); updateGateUI();
    if(tLeft()<=0) finishTimer();
  },500);
}
function finishTimer(){
  clearInterval(T.iv); T.run=false; T.held=0;
  $('#tPlay').textContent='▶'; $('#timerbox').classList.remove('run');
  S.timerDone[STEPS[S.step].id]=true; save();
  bell(); render(true);
  flash('The beat is served. Stay longer if you need to.');
}
function pauseTimer(){ T.held=tLeft(); clearInterval(T.iv); T.run=false;
  $('#tPlay').textContent='▶'; $('#timerbox').classList.remove('run'); drawTimer(); updateGateUI(); }
$('#tPlay').onclick=()=>{ T.run?pauseTimer():startTimer(); };
$('#tReset').onclick=()=>{ pauseTimer(); const st=STEPS[S.step];
  T.held = S.timerDone[st.id] ? 0 : T.total;
  drawTimer(); updateGateUI(); if(T.held>0) startTimer(); };
/* coming back to the tab: catch up immediately rather than on the next tick */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){
  if(T.run && tLeft()<=0) finishTimer(); else { drawTimer(); updateGateUI(); } }});

/* ---- global tick ---- */
function tick(){ for(const k in tickers){ try{tickers[k]();}catch(e){} } updateGateUI(); }
setInterval(tick,1000);

/* ---- nav ---- */
$('#btnBack').onclick=()=>{ S.step=Math.max(0,S.step-1); render(); };
$('#btnNext').onclick=()=>{
  if(S.step===STEPS.length-1){
    if(!gateState().open){ go(S.step+1); return; }
    if(confirm('Clear everything and begin again from the first screen?')){
      ['called','dopen','ladder','fill','checks','confirms','timerDone','cordEnds'].forEach(k=>S[k]={});
      Object.assign(S,{step:0,farewell:'',cordMode:null,lit:false,pushed:false,sat:false,reached:0});
      wipe(); render();
    }
    return;
  }
  go(S.step+1);
};
/* preview: triple-tap the step counter to lift the locks (for walking it through) */
let tapN=0,tapT=0;
$('#stepno').onclick=()=>{
  const now=Date.now(); tapN = (now-tapT<800)?tapN+1:1; tapT=now;
  if(tapN>=3){ tapN=0; S.preview=!S.preview;
    flash(S.preview?'Preview mode — locks off':'Locks back on'); render(); }
};

/* ---- chrome ---- */
$('#btnSound').onclick=e=>{ S.sound=!S.sound; e.currentTarget.classList.toggle('on',S.sound); if(S.sound) bell(660,.5); };
$('#btnSound').classList.add('on');
$('#btnText').onclick=()=>{ S.scale = S.scale>=1.3 ? 1 : S.scale+0.15;
  document.documentElement.style.setProperty('--scale',S.scale);
  $('#btnText').classList.toggle('on',S.scale>1); };

/* ============================================================ EVENTS */
$('#stage').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='chk'){ S.checks[b.dataset.id]=!S.checks[b.dataset.id]; render(true); }
  if(a==='confirm'){ const k=b.dataset.k; S.confirms[k]=!S.confirms[k];
    if(S.confirms[k]) bell(494,1.1); render(true); }
  if(a==='cord'){ S.cordMode=b.dataset.v; render(true); }
  if(a==='side'){ S.checks.side=b.dataset.v; S.side=b.dataset.v; render(true); }
  if(a==='burned'){ S.checks.burned=!S.checks.burned; bell(392,1.8); render(true); }
  if(a==='lit'){ S.lit=!S.lit; if(S.lit) bell(528,1.6); render(true); }
  if(a==='pushed'){ S.pushed=!S.pushed; if(S.pushed) bell(440,2.2); render(true); }
  if(a==='sat'){ S.sat=!S.sat; if(S.sat) bell(349,2.4); render(true); }
  if(a==='parch'){ $('#parchOut').innerHTML=parchmentHTML(); $('#parchOut').scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if(a==='wipe'){ if(confirm('Clear your saved progress and start from the beginning?')){
    ['called','dopen','ladder','fill','checks','confirms','timerDone','cordEnds'].forEach(k=>S[k]={});
    Object.assign(S,{step:0,farewell:'',cordMode:null,lit:false,pushed:false,sat:false,reached:0});
    wipe(); render(); } }
  if(a==='copyparch') copy(parchmentText(),b);
  if(a==='copyrelay') copy(relayLine(),b);
  if(a==='copysit') copy(sittingLine(),b);
  if(a==='copyfill') copy(`The space that is now empty is ${S.fill.space}. Into it goes ${S.fill.into}. I will feed it by ${S.fill.feed}, and I will do that by ${S.fill.when}.`,b);
  if(a==='dopen'){ const id=b.dataset.d; S.dopen[id]=!S.dopen[id]; render(true); }
  if(a==='invoke'){ openInvocation(b.dataset.d); }
  if(a==='skipgeo'){ S.geoDecided=true; render(true);
    $('#geoMsg').textContent='Fine — you still get your launch time and your place in the relay. Only sunset and true dark need a location, and the second sitting will simply not count down for you.'; }
  if(a==='geo'){
    const msg=$('#geoMsg'); msg.textContent='Asking your browser…';
    if(!navigator.geolocation){ msg.textContent='This browser will not share a location. Pick the nearest city instead.'; return; }
    navigator.geolocation.getCurrentPosition(p=>{
      S.lat=p.coords.latitude; S.lon=p.coords.longitude; S.place='your location';
      render(true); $('#geoMsg').textContent='Got it. Sunset and true dark are set for where you actually are.';
    },()=>{ msg.textContent='Location refused or unavailable — pick the nearest city below, it is close enough for sunset.'; },
    {timeout:9000,maximumAge:6e5});
  }
});
$('#stage').addEventListener('change',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='city'){
    const i=t.value; if(i===''){ return; }
    const c=CITIES[+i]; S.place=c[0]; S.lat=c[1]; S.lon=c[2]; render(true);
  }
  if(t.dataset.act==='fill'){ S.fill[t.dataset.k]=t.value; render(true); }
});
$('#stage').addEventListener('input',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='ladder'){ S.ladder[t.dataset.k]=t.value; }
  if(a==='cordend'){ S.cordEnds[t.dataset.k]=t.value; updateGateUI(); }
  if(a==='farewell'){ S.farewell=t.value; updateGateUI(); }
  if(a==='fill'){ S.fill[t.dataset.k]=t.value; updateGateUI(); }
});
$('#stage').addEventListener('blur',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='ladder'){ render(true); }
},true);

/* ---- invocation overlay ---- */
let ovlId=null;
function openInvocation(id){
  const d=DEITIES.find(x=>x.id===id); if(!d) return;
  ovlId=id;
  $('#ovlWho').textContent=d.n+' · '+d.say;
  $('#ovlWords').textContent=d.inv;
  $('#ovlNote').innerHTML='Offering — '+d.off;
  $('#ovlDone').textContent = S.called[id] ? 'Called ✓' : 'Called ✓';
  $('#ovl').classList.add('show');
}
$('#ovlClose').onclick=()=>$('#ovl').classList.remove('show');
$('#ovlDone').onclick=()=>{ if(ovlId){ S.called[ovlId]=true; bell(587,1.2); } $('#ovl').classList.remove('show'); render(true); };

/* ============================================================ DRAWER */
const TABS=[
 ['deities','The Eight'],['hour','The hour'],['boat','The boat'],['dark','Dark & relay'],
 ['cautions','Cautions'],['crib','If it goes sideways'],['why','Why tonight']
];
let tab='deities';
function drawerBody(){
  if(tab==='deities'){
    return `<h2>The Eight</h2><p class="lede">Deities of release, unbinding and the opened road. Male and female, bright and dark, seven traditions.</p>`
    + DEITIES.map(d=>`<div class="card"><h3>${esc(d.n)} <span class="glyph">${esc(d.g)}</span></h3>
      <p class="tiny" style="font-family:var(--mono)">${esc(d.say)} · ${esc(d.tag)}</p>
      <dl class="drow"><dt>Holds</dt><dd>${d.holds}</dd></dl>
      <dl class="drow"><dt>Why tonight</dt><dd>${d.why}</dd></dl>
      <dl class="drow"><dt>Offering</dt><dd>${d.off}</dd></dl>
      <dl class="drow"><dt>Approach</dt><dd>${d.app}</dd></dl>
      <div class="say" style="margin-bottom:0">${esc(d.inv)}</div></div>`).join('')
    + `<div class="card flat" style="border-style:dashed"><h4>Who is not on this list</h4>
       <p style="margin:0">No Orisha, no Lwa, no Indigenous or otherwise initiatory figures. Not because they lack release aspects — several have them profoundly — but because those are held within lineages with living gatekeepers, and a public open working is not where that door gets opened.</p></div>`;
  }
  if(tab==='hour'){
    const beats=[[':00','Open','The fires are lit — welcome, framing, the shape of the hour in three sentences.'],
    [':05','Ward','Casting, then the physical check out of ritual voice. Touch your water.'],
    [':10','Call','Invocation of the Eight. Ganesha first; Wepwawet held back for the road.'],
    [':17','Name','The Naming — parchment, red ink, own hand. The Precision Ladder. Worth overrunning.'],
    [':29','Cut','The Cord — two named ends. Cut for what is finished, untie for what continues altered.'],
    [':36','Burn','The Fire — one at a time, read aloud, watch it all the way out.'],
    [':43','Fill','The Emptied Space — Wepwawet, and the formula said aloud with a date attached.'],
    [':50','Build','The Boat — write the farewell, bind the paper. Do not light.'],
    [':60','Launch','Eight o’clock, outdoors. Light, one push, hands off.'],
    [':70','Close','Thanks and release in reverse order, Ganesha last. Water, food, land yourself.'],
    ['dark','Sitting','The second sitting at your own true dark. Look, do not touch.']];
    return `<h2>The order of service</h2><p class="lede">Sixty minutes plus a fifteen-minute coda, plus the sitting at your own dark. Timings are the shape, not a cage.</p>
    <table class="tbl"><thead><tr><th>Clock</th><th>Beat</th><th>What happens</th></tr></thead><tbody>
    ${beats.map(b=>`<tr><td class="m">${b[0]}</td><td>${b[1]}</td><td>${esc(b[2])}</td></tr>`).join('')}</tbody></table>
    <h3 style="margin-top:28px">The Precision Ladder</h3>
    <ol>${LADDER.map(r=>`<li><b>${esc(r.t)}</b><br><span class="tiny">${r.ex}</span></li>`).join('')}</ol>
    <h3 style="margin-top:28px">The Filling Formula</h3>
    <div class="card"><p><b>1 · The space that is now empty is</b> ______</p>
    <p><b>2 · Into it goes</b> ______ — one thing. Not a list. A list is how the old thing gets back in.</p>
    <p><b>3 · I will feed it by</b> ______ <b>, and I will do that by</b> ______ — one concrete action, with a date inside seven days.</p>
    <p style="margin:0" class="muted">If what goes in is a version of the thing you just burned, go back a rung. That is the old thing wearing a coat, and it is the single most common failure of release work.</p></div>`;
  }
  if(tab==='boat'){
    return `<h2>The Boat</h2>
    <p class="lede">Our own okuribi, on water, outdoors. Build the frame ahead; write and bind it in the hour; light it at eight.</p>
    <p>One of the five Kyoto fires is not a character at all but <b>Funagata</b>, the shape of a boat, because some journeys are made by water. Obon closes on water as well as fire: <b>tōrō nagashi</b>, the floating of lanterns, sends the same farewell downstream on a paper-walled boat with a light inside.</p>
    <figure class="diagram">${LANTERN_SVG}<figcaption>Funagata — after the fourth Kyoto fire</figcaption></figure>
    <h3>Building it</h3><ol>${BUILD.map(b=>`<li><b>${esc(b.t)}</b><br>${b.d}</li>`).join('')}
    <li><b>Write the paper — in the working, not before.</b> Inside face if it is yours alone; outside face if you want it witnessed. Once it is bound and lit you cannot change it, and that is deliberate.</li>
    <li><b>Bind it.</b> Wrap the strip round the outside of the four posts, tie off with cotton twine top and bottom. Leave the top open; the lantern is a chimney, not a box.</li>
    <li><b>At eight: light, launch, one push.</b> Then do not touch it again.</li>
    <li><b>Come back at dark, look without touching, then retrieve everything and empty the tub.</b></li></ol>
    <div class="card"><h4>Why the boat carries something different from the parchment</h4>
    <p><b>The parchment is the account</b> — the arrangement, the habit, the hold, named exactly, including your own part in it. Ugly, specific, and it goes to the fire. <b>The lantern paper is the farewell</b> — what you would say to the thing if it could hear you, and if you had finished being angry. Two lines is plenty.</p>
    <p style="margin:0">Obon does both. You do not only burn; you also say goodbye, and the goodbye is the part that lets it actually leave. A working that is all fire and no farewell tends to bring the thing back in a new coat within the month.</p></div>
    <div class="card"><h4>Which of the eight stand over the water</h4>
    <p style="margin:0">Half the roster is already wet, which is part of why this fits rather than being bolted on. <b>Wepwawet</b> stands at the prow of the solar barque — he is a boat god before he is anything else. <b>Marzanna</b> is drowned at least as often as she is burned. <b>Mèng Pó</b> keeps her station at a bridge, which is to say at a crossing over water.</p></div>`;
  }
  if(tab==='dark'){
    const rows=[['Reykjavík','21:39','01:03 — barely','5h — LED, and take what dark you get'],
    ['Anchorage','21:54','00:14','4h 14m — LED essential'],['Stockholm','20:34','22:34','2h 34m'],
    ['Edinburgh','20:46','22:27','2h 27m'],['Dublin','20:50','22:21','2h 21m'],
    ['Berlin','20:29','21:57','1h 57m'],['London','20:20','21:45','1h 45m'],
    ['Vancouver','20:26','21:45','1h 45m'],['Toronto','20:19','21:28','1h 28m'],
    ['New York','19:52','20:57','57m'],['Denver','19:54','20:58','58m'],
    ['Los Angeles','19:38','20:36','36m'],['Phoenix','19:12','20:10','10m'],
    ['Tokyo · Sydney · Auckland · Delhi · Honolulu','—','already dark','none — you simply stay']];
    return `<h2>The Two Moments</h2>
    <p class="lede">Eight o'clock is not dark. Know this before you start, or you will spend the evening quietly assuming you got the inferior version of the working.</p>
    <div class="card"><h4>First — eight o'clock. The launch.</h4>
    <p style="margin:0">This is the working and it does not move. Eight local is Kyoto's hour, and holding it is what makes the relay a chain rather than a scatter. You light, set it on the water, give it <b>one push</b>, and walk away. Whether you can see it glow is not the point and never was. <b>A lantern you cannot see is still lit.</b> The dead of Obon are not visible either.</p></div>
    <div class="card"><h4>Second — your own dark. The sitting.</h4>
    <p>Come back when night has actually arrived where you are. Do not touch it. <b>You are returning to see where it got to without you</b> — and the whole gap between the two moments is time in which you had no say in the matter. That is the part that does the work.</p>
    <p style="margin:0">Some will come back to a boat still burning against the side of the tub. Some to one that went out an hour ago. Some to one that has drifted nowhere at all. None of these is the wrong result.</p></div>
    <table class="tbl"><thead><tr><th>Where</th><th>Sunset</th><th>True dark</th><th>Gap after launch</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="m">${esc(r[1])}</td><td class="m">${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table>
    <p class="tiny">Times for 16 August 2026, local. "True dark" is nautical twilight — the point at which a small flame on water actually reads against the background. <b>Anything over three hours means an LED</b>, because a tealight will not survive the wait.</p>
    <h3 style="margin-top:28px">The relay</h3>
    <p>Everyone lights at eight local, which is when Kyoto lights. The first lantern goes on in the Line Islands at 06:00 UTC on the sixteenth; the last in American Samoa at 07:00 UTC on the seventeenth. <b>Twenty-five hours, and for every one of them somebody among us has a light on the water.</b></p>
    <p class="muted">Post your launch <b>time</b> at eight, and your <b>photo</b> at the second moment. The thread then holds both — a clean westward chain of times, and a slower trail of images following a couple of hours behind. That lag is the shape of night crossing the earth.</p>`;
  }
  if(tab==='cautions'){
    return `<h2>Cautions</h2>
    <div class="card warn"><h4>The hour</h4><ul>${CAUTIONS_HOUR.map(c=>`<li><b>${esc(c[0])}</b> — ${esc(c[1])}</li>`).join('')}</ul></div>
    <div class="card warn"><h4>The boat, outdoors</h4>
    <p style="color:var(--ink)"><b>Check your local fire restrictions before you strike anything.</b> This is the middle of August. Large parts of the American West, the Mediterranean and southern Australia are under burn bans, fire watches or total fire restrictions at exactly this time of year, and a burn ban means a burn ban — it does not have a folk-practice exemption. If you are anywhere near one, take the LED. Nobody in this circle is being asked to choose between the rite and the fire service.</p>
    <ul>${CAUTIONS_BOAT.map(c=>`<li><b>${esc(c[0])}</b> — ${c[1]}</li>`).join('')}</ul>
    <p style="margin:0"><b>No outdoor space at all?</b> Balcony with an LED, or indoors in a washing-up bowl on a towel. A soup bowl is a river. Scale was never the point; the single push is the point.</p></div>`;
  }
  if(tab==='crib'){
    return `<h2>If it goes sideways</h2><p class="lede">The things that come up every time. None of them means you are doing it wrong.</p>
    ${CRIB.map(c=>`<div class="card"><h4>${esc(c[0])}</h4><p style="margin:0">${c[1]}</p></div>`).join('')}
    <div class="card deep"><h4>Materials, at a glance</h4>
    <p><b>The hour —</b> cauldron or chalice, candles, cord, parchment, red ink, blade or scissors, offerings, water in reach.</p>
    <p style="margin:0"><b>The boat —</b> water vessel, floating base six inches across, four chopsticks, a blank paper strip, cotton twine, tealight or LED, hot glue or tape, a sheltered outdoor spot on hard ground.</p></div>`;
  }
  return `<h2>Why tonight</h2>
  <p>Tonight is the night of the <b>okuribi</b> — the send-off fires. In Kyoto the five mountain fires of <b>Gozan no Okuribi</b> are lit on the sixteenth of August at eight in the evening: the characters for <i>great</i>, <i>wondrous</i>, <i>dharma</i>, a boat, and a shrine gate, burning on the hillsides to close Obon and light the returning road for the dead who have been visiting since the thirteenth.</p>
  <p>The logic is exactly ours, and worth saying plainly at the top: <b>the fire is not for destruction. It is for the journey out.</b> Obon does not end by pretending the dead were never there. It ends by feeding them, sitting with them, and then lighting a road and saying <i>go well</i>. Everything we burn tonight gets the same treatment. We are not incinerating what we hated. We are lighting the way out for what we are done with — and then, unlike almost everyone, we are staying in the room long enough to fill the gap.</p>
  <p>Note which of the five characters is not a character at all. <b>Funagata</b> — the boat. Among the words for great, wondrous and dharma, one hillside burns the shape of a vessel, because some journeys are made by water. Obon closes on water as well as fire: <b>tōrō nagashi</b>, the floating of lanterns, sends the same farewell downstream on a paper-walled boat with a light inside. So we build one too.</p>
  <hr class="rule">
  <p class="tiny">This page is a single self-contained file. Nothing you type is stored, sent, or shared — no server, no account, no cookie. It runs entirely on your own device and forgets everything when you close it. To reuse it next year, open the file and change the date in the first line of the script.</p>`;
}
function drawTabs(){
  $('#dwTabs').innerHTML=TABS.map(t=>`<button class="dwtab ${tab===t[0]?'on':''}" data-t="${t[0]}">${esc(t[1])}</button>`).join('');
  $('#dwBody').innerHTML=drawerBody();
  $('#dwBody').scrollTop=0;
}
$('#btnRef').onclick=()=>{ $('#drawer').classList.add('show'); drawTabs(); };
$('#dwClose').onclick=()=>$('#drawer').classList.remove('show');
$('#dwTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return; tab=b.dataset.t; drawTabs(); });

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ $('#ovl').classList.remove('show'); $('#drawer').classList.remove('show'); }
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') go(S.step+1);
  if(e.key==='ArrowLeft') go(S.step-1);
});

/* ============================================================ BOOT */
load();
document.documentElement.style.setProperty('--scale',S.scale||1);
$('#btnSound').classList.toggle('on',S.sound!==false);
render();
</script>
</body>
</html>
