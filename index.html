
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Spell Hour — The Unbinding</title>
<meta name="description" content="A self-guiding working for release, unbinding and cord-cutting. Wherever you are, whenever you open it.">
<style>
  :root{
    --bg:#0d0a09; --panel:#15100e; --panel2:#1c1512; --panel3:#241b16;
    --line:#3a2a22; --line2:#523b2f;
    --ink:#ece3da; --dim:#a89484; --faint:#7a6759;
    --ember:#e0813c; --ember2:#c9663a; --ash:#9aa8b0; --gold:#d9b06a;
    --ok:#7fae7a; --bad:#d4635a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --topH:56px; --botH:72px;
    --scale:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--serif);
    font-size:calc(17px * var(--scale)); line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 90% 55% at 50% 108%, rgba(224,129,60,.15), transparent 70%);
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--gold)}

  /* ============ TOP BAR ============ */
  .top{
    position:fixed;top:0;left:0;right:0;height:var(--topH);z-index:60;
    background:rgba(13,10,9,.94);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:0 12px;
    padding-top:env(safe-area-inset-top);
  }
  .top .brand{
    font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ember);font-weight:700;white-space:nowrap;
  }
  .top .brand b{display:block;color:var(--faint);font-weight:500;letter-spacing:.14em;font-size:9.5px;margin-top:2px}
  .top .spacer{flex:1}
  .iconbtn{
    width:38px;height:38px;border-radius:3px;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--dim);font-size:15px;flex:none;
  }
  .iconbtn:hover{border-color:var(--line2);color:var(--ink)}
  .iconbtn.on{border-color:var(--ember2);color:var(--ember)}
  .progwrap{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--line)}
  .progbar{height:100%;background:linear-gradient(90deg,var(--ember2),var(--gold));width:0;transition:width .45s ease}
  .stepno{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

  /* ============ LAYOUT ============ */
  main{
    position:relative;z-index:1;
    padding:calc(var(--topH) + 26px + env(safe-area-inset-top)) 20px calc(var(--botH) + 40px);
    max-width:800px;margin:0 auto;
  }
  .screen{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ember);font-weight:700;margin:0 0 10px;
  }
  h1{font-size:clamp(1.9rem,6.5vw,2.7rem);line-height:1.08;margin:0 0 14px;font-weight:400;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--gold)}
  h2{font-size:clamp(1.45rem,4.6vw,1.95rem);line-height:1.15;margin:0 0 12px;font-weight:400}
  h3{font-size:1.15rem;font-weight:400;margin:0 0 8px}
  h4{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember);margin:0 0 12px;font-weight:700}
  p{margin:0 0 14px}
  .lede{color:var(--dim);font-size:1.05rem}
  .muted{color:var(--faint);font-size:.9rem}
  .tiny{font-size:.82rem;color:var(--faint)}
  strong,b{color:var(--ink);font-weight:600}
  hr.rule{border:0;border-top:1px solid var(--line);margin:30px 0}

  /* ============ CARDS / BOXES ============ */
  .card{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:20px 22px;margin:0 0 16px}
  .card.warn{border-color:#6b3a24;background:rgba(224,129,60,.06)}
  .card.deep{background:var(--panel2)}
  .card.flat{background:none}
  .card p:last-child,.card ul:last-child,.card ol:last-child{margin-bottom:0}
  ul,ol{margin:0 0 14px;padding-left:20px;color:var(--dim)}
  li{margin-bottom:8px}

  /* spoken text */
  .say{
    border-left:2px solid var(--ember2);
    background:linear-gradient(90deg,rgba(224,129,60,.08),transparent 72%);
    padding:14px 0 14px 18px;margin:16px 0;
    font-style:italic;color:#f4eae0;font-size:1.06rem;line-height:1.56;
  }
  .say::before{
    content:"say this aloud";display:block;font-style:normal;font-family:var(--sans);
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember);margin-bottom:8px;
  }
  .say.alone::before{content:"say this aloud — alone or together"}
  .teach{border:1px dashed var(--line2);border-radius:4px;background:rgba(217,176,106,.04);padding:18px 20px;margin:16px 0}
  .teach h4{color:var(--gold)}
  .teach p:last-child{margin-bottom:0}
  .aside{color:var(--faint);font-size:.9rem;font-style:italic;margin:10px 0 16px;padding-left:14px;border-left:1px solid var(--line)}

  /* ============ BUTTONS ============ */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--sans);font-size:13px;letter-spacing:.06em;font-weight:600;
    padding:13px 20px;border-radius:3px;border:1px solid var(--line2);color:var(--ink);
    background:var(--panel2);transition:.16s;text-align:center;
  }
  .btn:hover{border-color:var(--gold);background:var(--panel3)}
  .btn.primary{background:linear-gradient(180deg,#c9663a,#a8502c);border-color:#e0813c;color:#fff}
  .btn.primary:hover{background:linear-gradient(180deg,#e0813c,#c9663a)}
  .btn.ghost{background:none;border-color:var(--line)}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.sm{padding:9px 14px;font-size:11.5px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}

  /* ============ BOTTOM BAR ============ */
  .bot{
    position:fixed;left:0;right:0;bottom:0;z-index:60;min-height:var(--botH);
    background:rgba(13,10,9,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .bot .nav{display:flex;gap:8px;flex:1;align-items:center}
  .timerbox{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;
    padding:7px 10px;font-family:var(--mono);font-size:13px;color:var(--ash);flex:none;
  }
  .timerbox .t{min-width:44px;text-align:center;letter-spacing:.04em}
  .timerbox.run{border-color:var(--ember2);color:var(--ember)}
  .timerbox button{color:var(--faint);font-size:12px;padding:2px 4px}
  .timerbox button:hover{color:var(--ink)}

  /* ============ SETUP / STATUS ============ */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
  .stat{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:14px 16px}
  .stat .k{font-family:var(--sans);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .stat .v{font-size:1.32rem;color:var(--gold);line-height:1.2;font-variant-numeric:tabular-nums}
  .stat .s{font-size:.82rem;color:var(--dim);margin-top:4px}
  .stat.big .v{font-size:1.9rem;color:var(--ember)}

  .field{margin:0 0 14px}
  .field label{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .inp,select.inp,textarea.inp{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
    padding:12px 13px;color:var(--ink);font-family:var(--serif);font-size:1rem;outline:none;
  }
  .inp:focus{border-color:var(--ember2);background:var(--panel3)}
  textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
  select.inp{font-family:var(--sans);font-size:.92rem;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}

  .toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .toggle button{flex:1;padding:12px 10px;font-family:var(--sans);font-size:12px;letter-spacing:.05em;color:var(--dim);background:var(--panel2)}
  .toggle button.on{background:var(--ember2);color:#fff;font-weight:600}

  /* ============ CHECKLIST ============ */
  .chk{
    display:flex;gap:13px;align-items:flex-start;padding:13px 14px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer;transition:.15s;
  }
  .chk:hover{border-color:var(--line2)}
  .chk .box{
    width:22px;height:22px;flex:none;border:1.5px solid var(--line2);border-radius:3px;
    display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px;transition:.15s;
  }
  .chk.done{background:rgba(127,174,122,.07);border-color:rgba(127,174,122,.4)}
  .chk.done .box{background:var(--ok);border-color:var(--ok);color:#0d0a09}
  .chk .txt{flex:1;font-size:.97rem;color:var(--dim)}
  .chk .txt b{display:block;color:var(--ink);margin-bottom:2px}
  .chk.done .txt b{color:var(--ok)}
  .chkmeter{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0 0 14px;letter-spacing:.05em}

  /* ============ DEITIES ============ */
  .dgrid{display:grid;gap:10px;margin-bottom:18px}
  .deity{border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden;transition:.18s}
  .deity.called{border-color:rgba(217,176,106,.5);background:linear-gradient(180deg,rgba(217,176,106,.06),transparent)}
  .dhead{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;text-align:left}
  .dnum{
    width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line2);
    display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint);
  }
  .deity.called .dnum{background:var(--gold);border-color:var(--gold);color:#0d0a09}
  .dname{flex:1;min-width:0}
  .dname .n{font-size:1.08rem;line-height:1.25}
  .dname .r{font-family:var(--mono);font-size:10.5px;color:var(--ash);margin-top:3px;letter-spacing:.02em}
  .dtag{font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);padding:3px 7px;border-radius:2px;flex:none}
  .dbody{padding:0 16px 16px;border-top:1px solid var(--line);margin-top:0;display:none}
  .deity.open .dbody{display:block;padding-top:14px}
  .drow{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-bottom:10px;font-size:.93rem}
  .drow dt{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-top:4px}
  .drow dd{margin:0;color:var(--dim)}
  .glyph{color:var(--gold);font-size:1rem;margin-left:6px}

  /* invocation overlay */
  .ovl{
    position:fixed;inset:0;z-index:90;background:rgba(8,6,5,.97);
    display:none;flex-direction:column;padding:26px 22px calc(22px + env(safe-area-inset-bottom));
    overflow-y:auto;animation:fade .3s ease;
  }
  .ovl.show{display:flex}
  .ovl .inner{margin:auto;max-width:640px;width:100%;text-align:center}
  .ovl .who{font-family:var(--sans);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ember);margin-bottom:20px}
  .ovl .words{font-size:clamp(1.3rem,4.6vw,1.85rem);line-height:1.5;font-style:italic;color:#f7efe6;margin-bottom:12px}
  .ovl .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(224,129,60,.12),transparent 62%)}

  /* ============ LADDER ============ */
  .rung{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:16px 18px;margin-bottom:10px;opacity:.4;pointer-events:none;transition:.3s}
  .rung.active,.rung.filled{opacity:1;pointer-events:auto}
  .rung.filled{border-color:rgba(217,176,106,.35)}
  .rhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
  .rnum{width:26px;height:26px;flex:none;border-radius:3px;background:var(--panel2);border:1px solid var(--ember2);color:var(--ember);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
  .rung.filled .rnum{background:var(--gold);border-color:var(--gold);color:#0d0a09}
  .rhead b{font-size:1.02rem;color:var(--ink);font-weight:600;line-height:1.35}
  .rex{color:var(--faint);font-style:italic;font-size:.88rem;margin:2px 0 10px 38px}

  /* parchment output */
  .parch{
    background:linear-gradient(170deg,#efe3cf,#e2d3ba);color:#2a1d14;
    border-radius:3px;padding:26px 26px 28px;font-family:var(--serif);
    box-shadow:0 10px 34px rgba(0,0,0,.55);margin:16px 0;
  }
  .parch h5{font-family:var(--sans);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#8a4a1c;margin:0 0 16px;font-weight:700}
  .parch .ln{margin-bottom:13px;line-height:1.5;font-size:1.02rem}
  .parch .ln span{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9a7a55;margin-bottom:3px}
  .parch .seal{margin-top:20px;padding-top:14px;border-top:1px solid rgba(138,74,28,.3);font-style:italic;color:#8a4a1c;font-size:1.05rem}

  /* ============ COUNTDOWN ============ */
  .count{
    text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--panel);
    padding:26px 20px;margin:0 0 16px;position:relative;overflow:hidden;
  }
  .count .lbl{font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
  .count .clock{font-family:var(--mono);font-size:clamp(2.1rem,10vw,3.4rem);color:var(--ember);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .count .sub{color:var(--dim);font-size:.92rem;margin-top:12px}
  .count.now{border-color:var(--ember);background:linear-gradient(180deg,rgba(224,129,60,.14),var(--panel))}
  .count.now .clock{color:var(--gold);font-size:clamp(1.5rem,6vw,2.2rem);font-family:var(--serif);font-style:italic}
  .count.past{opacity:.75}
  .count.past .clock{color:var(--ash)}

  /* ============ RELAY ============ */
  .relaybar{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);position:relative;margin:16px 0 8px;overflow:hidden}
  .relaybar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(217,176,106,.35),var(--ember));transition:width 1s linear}
  .relaybar .me{position:absolute;top:-4px;width:2px;height:16px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .relayends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint);margin-bottom:20px}

  .zlist{border-top:1px solid var(--line)}
  .z{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(58,42,34,.6);font-size:.93rem}
  .zdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line2)}
  .z.lit .zdot{background:var(--gold);box-shadow:0 0 7px rgba(217,176,106,.8)}
  .z.now .zdot{background:var(--ember);box-shadow:0 0 12px var(--ember);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.35)}}
  .z .zn{flex:1;color:var(--dim)}
  .z.lit .zn,.z.now .zn{color:var(--ink)}
  .z .zt{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
  .z.now{background:linear-gradient(90deg,rgba(224,129,60,.1),transparent)}
  .z.me{background:linear-gradient(90deg,rgba(217,176,106,.13),transparent)}
  .z.me .zn::after{content:" — you";color:var(--gold);font-style:italic}

  /* ============ TABLE ============ */
  .tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:0 0 14px}
  .tbl th{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
  .tbl td{padding:7px 10px 7px 0;border-bottom:1px solid rgba(58,42,34,.5);color:var(--dim)}
  .tbl td:first-child{color:var(--ink)}
  .tbl td.m{font-family:var(--mono);font-size:11.5px;color:var(--ash);white-space:nowrap}
  .tbl tr.hi td{color:var(--gold)}

  /* ============ DRAWER ============ */
  .drawer{
    position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;
    animation:slideup .3s ease;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .drawer.show{display:flex}
  .dwtop{
    display:flex;align-items:center;gap:8px;padding:14px 14px;border-bottom:1px solid var(--line);
    padding-top:calc(14px + env(safe-area-inset-top));flex:none;
  }
  .dwtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
  .dwtabs::-webkit-scrollbar{display:none}
  .dwtab{
    font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 13px;border:1px solid var(--line);border-radius:3px;color:var(--dim);white-space:nowrap;flex:none;
  }
  .dwtab.on{background:var(--ember2);border-color:var(--ember2);color:#fff;font-weight:600}
  .dwbody{flex:1;overflow-y:auto;padding:22px 20px calc(40px + env(safe-area-inset-bottom));max-width:800px;margin:0 auto;width:100%}

  /* ============ DIAGRAM ============ */
  .diagram{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:14px 10px 8px;margin:0 0 16px}
  .diagram svg{width:100%;height:auto;display:block}
  .diagram figcaption{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;margin-top:10px}
  .flame{animation:flick 3.4s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:.9}35%{opacity:.62}55%{opacity:1}75%{opacity:.75}}

  /* ============ MISC ============ */
  .pill{display:inline-block;font-family:var(--sans);font-size:10px;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--line);border-radius:2px;padding:4px 9px;color:var(--dim);margin:0 6px 6px 0}
  .pill.hot{border-color:var(--ember2);color:var(--ember)}
  .pill.good{border-color:rgba(127,174,122,.5);color:var(--ok)}
  .banner{border-left:3px solid var(--ember);background:rgba(224,129,60,.08);padding:14px 16px;border-radius:0 3px 3px 0;margin:0 0 16px;font-size:.95rem;color:var(--dim)}
  .banner b{color:var(--ink)}
  .banner.danger{border-color:var(--bad);background:rgba(212,99,90,.1)}
  .banner.calm{border-color:var(--ash);background:rgba(154,168,176,.07)}
  .copied{color:var(--ok);font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .privacy{display:flex;gap:9px;align-items:flex-start;color:var(--faint);font-size:.82rem;margin:14px 0;line-height:1.5}
  .privacy span{flex:none;color:var(--ok)}

  /* ---- lock panel ---- */
  .gatep{
    border:1px solid var(--line2);border-left:3px solid var(--ember2);border-radius:0 4px 4px 0;
    background:linear-gradient(90deg,rgba(224,129,60,.07),var(--panel) 60%);
    padding:16px 18px;margin:30px 0 6px;
  }
  .gatep.open{border-left-color:var(--ok);background:linear-gradient(90deg,rgba(127,174,122,.07),var(--panel) 60%)}
  .gatep.preview{border-left-color:var(--ash);background:rgba(154,168,176,.06)}
  .gatep h4{margin-bottom:11px}
  .gatep.open h4{color:var(--ok)}

<script>
/* ==========================================================================
   SPELL HOUR — THE UNBINDING
   A self-guiding working. Single file, no dependencies, no storage, no network.
   To reuse next year: change EVENT.y / EVENT.m / EVENT.d below. That is all.
   ========================================================================== */

const EVENT = { y:2026, m:8, d:16, hour:20 };   // 16 August 2026, 20:00 local
const S = {                                      // in-memory state only
  step:0, lat:null, lon:null, place:null, sound:true, scale:1,
  called:{}, dopen:{}, ladder:{}, fill:{}, farewell:'', cordMode:null, cordEnds:{},
  checks:{}, lit:false, pushed:false, sat:false,
  confirms:{}, timerDone:{}, geoDecided:false, preview:false, reached:0
};

/* --------------------------------------------------------------- STORAGE
   Progress is remembered on this device so a locked screen can be left and
   come back to — you can close the tab at seven and return at eight.
   What you WRITE is never saved: the ladder, the farewell, the filling lines
   and the cord ends live in this tab only and die with it. */
const KEEP=['step','lat','lon','place','called','checks','confirms','timerDone',
            'geoDecided','lit','pushed','sat','cordMode','reached','sound','scale'];
let storageOK=true;
function save(){
  if(!storageOK) return;
  try{ const o={}; KEEP.forEach(k=>o[k]=S[k]);
    localStorage.setItem('spellhour-'+EVENT.y+'-'+EVENT.m+'-'+EVENT.d,JSON.stringify(o));
  }catch(e){ storageOK=false; }
}
function load(){
  try{ const raw=localStorage.getItem('spellhour-'+EVENT.y+'-'+EVENT.m+'-'+EVENT.d);
    if(!raw) return; const o=JSON.parse(raw); KEEP.forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; });
  }catch(e){ storageOK=false; }
}
function wipe(){ try{ localStorage.removeItem('spellhour-'+EVENT.y+'-'+EVENT.m+'-'+EVENT.d);}catch(e){} }

/* ---------------------------------------------------------------- CONTENT */

const DEITIES = [
 {id:'ganesha', n:'Ganesha', g:'गणेश · Vighnaharta', say:'guh-NEH-shuh · vig-nuh-HAR-tuh', tag:'Hindu · first & last', order:1,
  holds:'Thresholds, beginnings, the obstacle itself. He is <b>Vighnaharta</b>, remover of obstacles, and <b>Vighneshvara</b>, <i>lord</i> of them — he places them as readily as he clears them, and both are the same office.',
  why:'Called first because he is always called first. Called again at the end, because the emptied space is a beginning and beginnings are his.',

  app:'A living devotional deity with millions of practitioners tonight. Come as a guest with something in your hands, not as a customer with a request.',

 {id:'hekate', n:'Hekate Kleidouchos', g:'Ἑκάτη Κλειδοῦχος', say:'heh-KAH-tay · klay-DOO-khos', tag:'Greek · opens', order:2,

 {id:'dionysos', n:'Dionysos Lyaios', g:'Διόνυσος Λύσιος', say:'dee-oh-NEE-sos · LEE-see-os', tag:'Greek · loosens', order:4,
  holds:'Untying. <b>Lyaios</b> and <b>Lysios</b> both mean the one who looses — from care, from anxiety, from the bond. He had a temple under that name at Thebes. He is also <b>Eleuthereus</b>, and the root is freedom.',

  app:'He loosens more than you asked. Be specific, and be somewhere safe afterwards.',

 {id:'fudo', n:'Fudō Myōō', g:'不動明王 · Acala', say:'FOO-doh MYOH-oh', tag:'Japanese Buddhist · cuts', order:5,

 {id:'marzanna', n:'Marzanna', g:'Morana · Mora', say:'mar-ZAH-nah / MOH-rah-nah', tag:'Slavic · burns', order:6,
  holds:'Winter, death, and the ending of a season by force. Her rite is unusually literal: a figure is built, dressed, carried out of the village, set alight and thrown in the water. The season does not lift on its own. It is <b>carried out</b>.',

 {id:'mengpo', n:'Mèng Pó', g:'孟婆', say:'mung PWOR', tag:'Chinese · forgets', order:7,

<script>
/* ============================================================ ASTRONOMY */
const RAD=Math.PI/180, DEG=180/Math.PI;
function dayOfYear(y,m,d){ return Math.floor((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5); }

/* Almanac-for-Computers sunrise/sunset. Returns UTC hours, or null if no event. */
function sunEventUT(y,m,d,lat,lon,zenith,rising){
  const N=dayOfYear(y,m,d), lngHour=lon/15;
  const t = rising ? N+((6-lngHour)/24) : N+((18-lngHour)/24);
  const M = 0.9856*t - 3.289;
  let L = M + 1.916*Math.sin(M*RAD) + 0.020*Math.sin(2*M*RAD) + 282.634; L=((L%360)+360)%360;
  let RA = DEG*Math.atan(0.91764*Math.tan(L*RAD)); RA=((RA%360)+360)%360;
  RA += (Math.floor(L/90)*90 - Math.floor(RA/90)*90); RA/=15;
  const sinDec=0.39782*Math.sin(L*RAD), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(zenith*RAD)-sinDec*Math.sin(lat*RAD))/(cosDec*Math.cos(lat*RAD));
  if(cosH>1||cosH<-1) return null;
  let H = rising ? 360-DEG*Math.acos(cosH) : DEG*Math.acos(cosH); H/=15;
  let UT = H + RA - 0.06571*t - 6.622 - lngHour;
  return ((UT%24)+24)%24;
}
/* The evening event (sunset / dusk) that follows local solar noon on the event
   date. Anchoring to solar noon rather than to a calendar date is what makes
   Anchorage work — its true dark falls after local midnight. */
function eveningEventDate(lat,lon,zenith){
  if(lat===null||lat===undefined) return null;
  const noonUTC = Date.UTC(EVENT.y,EVENT.m-1,EVENT.d,12,0,0) - (lon/15)*3600e3;
  let best=null;
  for(const dd of [EVENT.d-1,EVENT.d,EVENT.d+1]){
    const ut=sunEventUT(EVENT.y,EVENT.m,dd,lat,lon,zenith,false);
    if(ut===null) continue;
    const t=Date.UTC(EVENT.y,EVENT.m-1,dd,0,0,0)+ut*3600e3;
    if(t>noonUTC && t<noonUTC+16*3600e3 && (best===null||t<best)) best=t;
  }
  return best===null?null:new Date(best);
}
const SUNSET_Z=90.8333, DARK_Z=102;   // 102° = nautical twilight = usable dark

/* ============================================================ TIME */
function tzOffsetMin(tz,date){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(date)
    .reduce((a,x)=>(a[x.type]=x.value,a),{});
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute,+p.second);
  return Math.round((asUTC-date.getTime())/60000);
}
/* the UTC instant at which it is EVENT.hour:00 local in tz on the event date */
function launchInstant(tz){
  let guess=new Date(Date.UTC(EVENT.y,EVENT.m-1,EVENT.d,EVENT.hour,0,0));
  for(let i=0;i<3;i++){
    const off=tzOffsetMin(tz,guess);
    guess=new Date(Date.UTC(EVENT.y,EVENT.m-1,EVENT.d,EVENT.hour,0,0)-off*60000);
  }
  return guess;
}
function myLaunch(){ return new Date(EVENT.y,EVENT.m-1,EVENT.d,EVENT.hour,0,0,0); }
function fmtLocal(dt,tz){
  if(!dt) return '—';
  return new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).format(dt);
}
function fmtUTC(dt){
  if(!dt) return '—';
  return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',
    hour12:false,timeZone:'UTC'}).format(dt).replace(',','')+' UTC';
}
function dur(ms){
  const neg=ms<0; ms=Math.abs(ms);
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  const str = h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
                  : `${m}:${String(ss).padStart(2,'0')}`;
  return (neg?'-':'')+str;
}
function durWords(ms){
  const s=Math.floor(Math.abs(ms)/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  if(h>=1) return `${h}h ${m}m`;
  return `${m}m`;
}

/* ============================================================ SOUND */
let AC=null;
function bell(freq=528,len=1.4){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0,AC.currentTime);
    g.gain.linearRampToValueAtTime(.16,AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+len);
    o.start(); o.stop(AC.currentTime+len);
    const o2=AC.createOscillator(), g2=AC.createGain();
    o2.type='sine'; o2.frequency.value=freq*1.5; o2.connect(g2); g2.connect(AC.destination);
    g2.gain.setValueAtTime(0,AC.currentTime);
    g2.gain.linearRampToValueAtTime(.05,AC.currentTime+.03);
    g2.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+len*.8);
    o2.start(); o2.stop(AC.currentTime+len);
  }catch(e){}
}

/* ============================================================ HELPERS */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function copy(txt,el){
  navigator.clipboard?.writeText(txt).then(()=>{
    if(el){const o=el.textContent; el.textContent='Copied ✓'; el.classList.add('copied');
      setTimeout(()=>{el.textContent=o; el.classList.remove('copied');},1800);}
  }).catch(()=>{});
}
function myTZ(){ try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){return 'UTC';} }
function sunsetToday(){ return S.lat===null?null:eveningEventDate(S.lat,S.lon,SUNSET_Z); }
function darkToday(){ return S.lat===null?null:eveningEventDate(S.lat,S.lon,DARK_Z); }
function gapToDark(){
  const dk=darkToday(); if(!dk) return null;
  return dk-myLaunch();
}
function needsLED(){
  const g=gapToDark();
  if(S.lat===null) return null;
  if(g===null) return true;          // no true dark → long wait
  return g > 3*3600e3;
}

function statBlock(){
  const tz=myTZ(), L=myLaunch(), now=new Date();
  const ss=sunsetToday(), dk=darkToday(), gap=gapToDark();
  const diff=L-now;
  let launchLine = diff>0 ? 'in '+durWords(diff) : durWords(diff)+' ago';
  let darkTxt = S.lat===null ? 'set your place' : (dk? fmtLocal(dk,tz) : 'no true dark tonight');
  let gapTxt = S.lat===null ? '—' : (gap===null? 'take the darkest hour you get' : durWords(gap)+' after launch');
  return `<div class="statgrid">
    <div class="stat big"><div class="k">Your launch</div><div class="v">${String(EVENT.hour).padStart(2,'0')}:00</div><div class="s">${esc(launchLine)}</div></div>
    <div class="stat"><div class="k">That is</div><div class="v" style="font-size:1.05rem">${fmtUTC(L)}</div><div class="s">${esc(tz)}</div></div>
    <div class="stat"><div class="k">Sunset</div><div class="v">${S.lat===null?'—':(ss?fmtLocal(ss,tz):'—')}</div><div class="s">${S.place?esc(S.place):'location not set'}</div></div>
    <div class="stat"><div class="k">True dark — second sitting</div><div class="v">${esc(darkTxt)}</div><div class="s">${esc(gapTxt)}</div></div>
  </div>`;
}

function relayRows(){
  const now=Date.now(), me=myLaunch().getTime(), tz=myTZ();
  const rows=ZONES.map(([z,label])=>({z,label,t:launchInstant(z).getTime()}));
  rows.push({z:'__me',label:'Where you are — '+tz.split('/').pop().replace(/_/g,' '),t:me,me:true});
  rows.sort((a,b)=>a.t-b.t);
  return rows.map(r=>{
    const d=now-r.t;
    const cls=(d>=0&&d<36e5)?'now':(d>=0?'lit':'');
    const rel = d>=0 ? (d<36e5?'lighting now':'lit '+durWords(d)+' ago') : 'in '+durWords(-d);
    return `<div class="z ${cls} ${r.me?'me':''}"><div class="zdot"></div>
      <div class="zn">${esc(r.label)}</div>
      <div class="zt">${fmtUTC(new Date(r.t)).replace(' UTC','')} · ${esc(rel)}</div></div>`;
  }).join('');
}
function relayProgress(){
  const rows=ZONES.map(([z])=>launchInstant(z).getTime());
  const first=Math.min(...rows), last=Math.max(...rows), now=Date.now();
  const pct=Math.max(0,Math.min(100,(now-first)/(last-first)*100));
  const mePct=Math.max(0,Math.min(100,(myLaunch().getTime()-first)/(last-first)*100));
  return {pct,mePct,first:new Date(first),last:new Date(last),
    hours:Math.round((last-first)/36e5)};
}

  <p class="chkmeter">${n('g')} / ${gate.length}</p>${list(gate,'g')}
  <div class="banner ${n('g')===gate.length?'':'danger'}">${n('g')===gate.length
    ? '<b>Good. You are clear to work.</b> A working that puts you in hospital has not banished anything.'
    : '<b>Not yet.</b> Every box on this screen, including the six above. The one you would have skipped is the one that matters. A working that puts you in hospital has not banished anything.'}</div>`;
 },
},

/* ---------------------------------------------------------- 3 · BOAT BUILD */
{id:'build', name:'Build the boat', eyebrow:'Funagata — the boat shape', mins:4,
 render(){
  const led=needsLED(), gap=gapToDark();
  let verdict='';
  if(S.lat===null){
    verdict=`<div class="banner"><b>Set your location on the first screen</b> and this will tell you whether a real flame will still be burning when you come back at dark.</div>`;
  } else if(led){
    verdict=`<div class="banner danger"><b>Take the LED.</b> ${gap===null?'You get no true dark tonight, so the wait is long and open-ended.':'True dark is '+durWords(gap)+' after you launch, and a tealight gives you about four hours.'} A candle will not be there when you come back — and a real flame must never be left unattended across that gap.</div>`;
  } else {
    verdict=`<div class="banner"><b>A real tealight is workable for you</b> — true dark is only ${durWords(gap)} after launch. Conditions: sheltered from wind, staying with it, no burn ban where you live, and <b>not on foam</b>. If any of those fails, take the LED. It is not the lesser version.</div>`;
  }
  const steps=BUILD.map((b,i)=>{
    const id='B'+i, on=S.checks[id];
    return `<div class="chk ${on?'done':''}" data-act="chk" data-id="${id}" style="align-items:flex-start">
      <div class="box">✓</div><div class="txt"><b>${i+1}. ${esc(b.t)}</b>${b.d}</div></div>`;}).join('');
  return `<h2>Build the frame — and stop there</h2>
  <p class="lede">In Japan the lanterns of <b>tōrō nagashi</b> go onto a river and the current does the rest. Most of us have no river, and those who do should not be putting anything into one. So we make the river.</p>
  <p><b>This goes outdoors, and that is the right way round.</b> The Kyoto fires burn on open hillsides; tōrō nagashi goes onto open rivers. Outdoors also settles the fire question in your favour — with sky above it, a real tealight becomes reasonable rather than reckless. What outdoors gives you instead is <b>wind</b>, and wind is the thing to plan around now.</p>
  <figure class="diagram">${LANTERN_SVG}<figcaption>Funagata — after the fourth Kyoto fire</figcaption></figure>
  <p class="eyebrow" style="margin-top:24px">The flame check — for where you are</p>
  ${verdict}
  <p class="eyebrow" style="margin-top:24px">Building it</p>
  ${steps}
  <div class="banner"><b>The paper stays blank.</b> You write on it during the working, not now. Once it is bound and lit you cannot change it, and that is also deliberate.</div>`;
 }
},

/* ---------------------------------------------------------- 4 · OPEN */
{id:'open', name:'The fires are lit', eyebrow:':00 — Open', mins:5,
 render(){ return `<h2>The fires are lit today, and so is yours</h2>
  <p class="lede">Take five minutes before you touch anything. You have arrived here scattered — everyone does — and the working goes badly if you start it still half in your day.</p>
  <div class="teach">
    <h4>The shape of the whole hour, in three words</h4>
    <p style="font-size:1.1rem;color:var(--ink)"><b>Name it. Part with it. Replace it.</b></p>
    <p>The third is the one nearly everyone skips, and it is the one that decides whether any of this holds. An emptied space fills with whatever is nearest, and what is nearest is generally the thing you just removed, because it knows the room.</p>
  </div>
  <p>Tonight the send-off fires burn above Kyoto — lit at eight in the evening to close Obon and light the returning road for the dead who have been visiting since the thirteenth. Borrow that logic exactly, because it is better than the one you are probably carrying: <b>the fire is not for destruction. It is for the journey out.</b></p>
  <p>Obon does not end by pretending the dead were never there. It ends by feeding them, sitting with them, and then lighting a road and saying <i>go well</i>. Everything you burn tonight gets the same treatment. You are not incinerating what you hated. You are lighting the way out for what you are done with — and then staying in the room long enough to fill the gap.</p>
  <div class="say alone">Tonight the fire is not for destruction. It is for the journey out. I am not here to burn what I hated. I am here to light the road for what I am done with, and to stay long enough to fill the space it leaves.</div>
  <p class="aside">Read it aloud even if there is nobody to hear it. The mouth commits what the mind will renegotiate later.</p>
  ${confirmBtn('open','I have said it aloud','Said aloud')}
  <p class="muted">Nothing gets lit until the next screen. The check comes first.</p>`;}
},

/* ---------------------------------------------------------- 5 · WARD */
{id:'ward', name:'Casting & the brief', eyebrow:':05 — Ward', mins:5,
 render(){ return `<h2>Cast, then drop out of ritual voice entirely</h2>
  <p class="lede">Cast as your practice runs. Then stop being solemn for one minute and run the physical check, out loud, like a person checking a stove.</p>
  <div class="banner"><b>Touch your water now.</b> Not think about it, not remember that there is a tap somewhere — put your hand on the vessel. The unromantic minute is the one that keeps this a working rather than an incident. If anyone is with you, have them touch theirs too.</div>
  <div class="teach">
    <h4>Four things, in order</h4>
    <p><b>Vessel</b> — takes heat without cracking. <b>Surface</b> — will not scorch, nothing hanging above it. <b>Water</b> — in reach, now. <b>Window</b> — open.</p>
    <p style="margin:0">Then: hair back, sleeves up. Nothing swallowed, nothing burned in a closed room, no accelerants ever.</p>
  </div>
  <p>Fix the boat plan in your head now too, so you are not improvising in the dark later: <b>frame already built, paper still blank, launch at eight local, outdoors, and a second sitting at your own true dark.</b></p>
  <p class="aside">If you are somewhere you cannot burn at all, you are not doing a lesser version. You will dissolve, bury, or shred — and Marzanna is drowned as often as she is burned.</p>
  ${confirmBtn('cast','The circle is cast','Cast')}
  ${confirmBtn('water','My hand is on the water — I have actually touched it','Water touched')}`;}
},

/* ---------------------------------------------------------- 6 · CALL */
{id:'call', name:'Invocation of the Eight', eyebrow:':10 — Call', mins:7,
 render(){
  const n=Object.keys(S.called).filter(k=>S.called[k]).length;
  const cards=DEITIES.map((d,i)=>`
   <div class="deity ${S.called[d.id]?'called':''} ${S.dopen[d.id]?'open':''}" data-d="${d.id}">
     <button class="dhead" data-act="dopen" data-d="${d.id}">
       <div class="dnum">${S.called[d.id]?'✓':d.order}</div>
       <div class="dname"><div class="n">${esc(d.n)}<span class="glyph">${esc(d.g)}</span></div><div class="r">${esc(d.say)}</div></div>
       <div class="dtag">${esc(d.tag)}</div>
     </button>
     <div class="dbody">
       <dl class="drow"><dt>Holds</dt><dd>${d.holds}</dd></dl>
       <dl class="drow"><dt>Why tonight</dt><dd>${d.why}</dd></dl>
       <dl class="drow"><dt>Offering</dt><dd>${d.off}</dd></dl>
       <dl class="drow"><dt>Approach</dt><dd>${d.app}</dd></dl>
       <div class="btnrow" style="margin-bottom:0">
         <button class="btn primary sm" data-act="invoke" data-d="${d.id}">Speak the invocation</button>
       </div>
     </div>
   </div>`).join('');
  return `<h2>Call the Eight</h2>
  <p class="lede">Eight roads to the same door, across seven traditions — male and female, bright and dark. Ganesha opens, and Ganesha closes. Tap a name to read it; tap <i>speak the invocation</i> for the words in large type, for reading aloud in poor light.</p>
  <div class="say alone">I call not one tradition tonight but eight roads to the same door — the key-bearer and the loosener, the eater of filth and the immovable blade, the carried-out season, the last cup, and the one who walks ahead. Be welcome. Be exact with me.</div>
  <p class="aside">Say <i>we</i> and <i>us</i> if there are others beside you. Leave a full breath between each name — the pause is doing as much as the words.</p>
  <p class="chkmeter" id="callMeter">${n} / 8 called</p>
  <div class="dgrid">${cards}</div>
  <div class="card flat" style="border-style:dashed">
    <h4>A note on who is not on this list</h4>
    <p style="margin:0">No Orisha, no Lwa, no Indigenous or otherwise initiatory figures are on tonight's roster. Not because they lack release aspects — several have them profoundly — but because those are held within lineages with living gatekeepers, and a public open working is not where that door gets opened. The eight above are all documented, publicly attested, and appropriate to name in any room. If you <i>are</i> initiated somewhere and wish to work your own lineage privately alongside this, that is yours to do — and not this page's to stage for you.</p>
  </div>`;
 }
},

/* ---------------------------------------------------------- 7 · NAME */
{id:'name', name:'The Naming', eyebrow:':17 — Name', mins:12,
 render(){
  let firstEmpty=LADDER.findIndex(r=>!(S.ladder[r.k]||'').trim());
  if(firstEmpty<0) firstEmpty=LADDER.length;
  const rungs=LADDER.map((r,i)=>{
    const val=S.ladder[r.k]||(r.pre&&i===firstEmpty?'':'');
    const state = (S.ladder[r.k]||'').trim() ? 'filled' : (i<=firstEmpty?'active':'');
    return `<div class="rung ${state}">
      <div class="rhead"><div class="rnum">${i+1}</div><b>${esc(r.t)}</b></div>
      <div class="rex">${r.ex}</div>
      <textarea class="inp" data-act="ladder" data-k="${r.k}" rows="2"
        placeholder="${esc(r.ph)}">${esc(val)}</textarea>
    </div>`;}).join('');
  const done=LADDER.every(r=>(S.ladder[r.k]||'').trim());
  return `<h2>The heart of it</h2>
  <p class="lede">This is where the hour is won or lost. The ladder below is for finding the words; the parchment is for committing them <b>in your own hand</b>. No typing on the sheet, no dictation, no proxies.</p>
  <div class="teach">
    <h4>Why "negativity" will not burn</h4>
    <p>"Negativity" is not a thing. It has never once been a thing. Fire needs something with edges — so write the arrangement, the habit, the actual hold.</p>
    <p style="margin:0">And write what you were <i>getting</i> out of it. That is rung four and it is the hard one, because you were getting something, or it would have ended by itself years ago. Nothing survives this long unpaid.</p>
  </div>
  <p class="eyebrow" style="margin-top:24px">The Precision Ladder</p>
  <p class="muted">Roughly a minute per rung. Each opens as you fill the one above. Take longer here than the timer suggests — this is the beat worth overrunning.</p>
  ${rungs}
  <div class="privacy"><span>●</span><div>Nothing here is stored or transmitted. When you close this tab it is gone. Copy it to your parchment in your own hand — that is the copy that matters.</div></div>
  ${done?`<div class="btnrow"><button class="btn primary wide" data-act="parch">Compose my parchment ↓</button></div><div id="parchOut"></div>
  ${confirmBtn('parch','I have written it out by hand, in red, on the parchment','Written by hand')}`
  :'<div class="banner">Fill all six rungs and the parchment will compose itself. This screen does not open until it is done — vague input, vague working.</div>'}`;
 }
},

/* ---------------------------------------------------------- 8 · CORD */
{id:'cord', name:'The Cord', eyebrow:':29 — Cut', mins:7,
 render(){
  const m=S.cordMode;
  const guide = m==='cut' ? `<div class="card"><h4>To cut — Fudō's blade</h4>
    <p>For what is finished. Measure the cord between the two named points. Say each end aloud before any blade comes near it. Then one clean stroke — a dull blade turns cutting into sawing and ruins the moment.</p>
    <div class="say">This end is me. This end is the thing I have named. The cord is not the relationship — the cord is the pull. I am not cutting a person. I am cutting the pull.</div>
    <p style="margin-bottom:0" class="muted">Fudō's sword does not cut people. It cuts the story. Point it at your account of the thing, never at someone's name.</p></div>`
   : m==='untie' ? `<div class="card"><h4>To untie — Dionysos' hands</h4>
    <p>For what must continue in altered form: a co-parent, a colleague, a body, a family, a chronic thing. <b>Untying is not the weaker working. It is the harder one.</b> Work the knot loose slowly with both hands and do not resort to the blade halfway.</p>
    <div class="say">Loosener, Releaser, god who unties — I have been holding this so long my hand has shaped itself around it. Loose the grip before you loose the thing. What I cannot cut, undo.</div>
    <p style="margin-bottom:0" class="muted">You are not ending the relation. You are ending the <i>pull</i> inside it. Name that distinction out loud or the working will overreach.</p></div>`
   : `<div class="banner">Choose above. Both are real workings; the choice is about whether the thing continues in your life in some altered form.</div>`;
  return `<h2>Two named ends, and only two</h2>
  <p class="lede">A cord measured between two points — you, and the account. Say what each end is <b>aloud</b> before anything sharp is involved.</p>
  <div class="field"><label>Which working is this?</label>
    <div class="toggle">
      <button data-act="cord" data-v="cut" class="${m==='cut'?'on':''}">Cut — it is finished</button>
      <button data-act="cord" data-v="untie" class="${m==='untie'?'on':''}">Untie — it continues, altered</button>
    </div></div>
  <div class="field"><label>This end is me —</label>
    <input class="inp" data-act="cordend" data-k="a" value="${esc(S.cordEnds.a||'')}" placeholder="your name, or what part of you is tied"></div>
  <div class="field"><label>This end is —</label>
    <input class="inp" data-act="cordend" data-k="b" value="${esc(S.cordEnds.b||'')}" placeholder="the arrangement, the habit, the hold — not a person's name"></div>
  ${guide}
  <div class="banner danger"><b>Nothing living gets cut.</b> No hair, no skin, no blood tonight. The cord is the cord.</div>
  ${S.cordMode?confirmBtn('cord',S.cordMode==='cut'?'The cord is cut':'The cord is untied','The cord is parted'):''}`;
 }
},

/* ---------------------------------------------------------- 9 · BURN */
{id:'burn', name:'The Fire', eyebrow:':36 — Burn', mins:7,
 render(){
  return `<h2>Carried out, not destroyed</h2>
  <p class="lede">Read your sheet aloud, then give it to the vessel. If it is not sayable in company, read only the closing line and hold the rest — the page burns the same either way.</p>
  <div class="banner"><b>Watch it go all the way out.</b> Do not turn away, do not start the next thing, do not move on while paper is still glowing. Let the silence sit longer than is comfortable; that discomfort is most of the working. If others are with you, one at a time and unhurried.</div>
  <div class="say alone">Not destroyed. Carried out. Go well, and go all the way.</div>
  ${S.ladder.closing?`<div class="card deep"><h4>Your closing line, to read at the fire</h4>
    <p style="font-size:1.15rem;font-style:italic;color:#f4eae0;margin:0">${esc(S.ladder.closing)}</p></div>`:''}
  <div class="card"><h4>If you cannot burn</h4>
  <p style="margin:0">Rental, roommates, no ventilation, attending from bed. These are <b>equivalent, not lesser</b>: <b>dissolve</b> the parchment in water and pour it out at a drain or a root; <b>bury</b> it; or <b>shred</b> it and part with the pieces in two directions. Marzanna is drowned as often as she is burned.</p></div>
  ${confirmBtn('read','I have read it aloud','Read aloud')}
  <div class="btnrow"><button class="btn ${S.checks.burned?'':'primary'} wide" data-act="burned">${S.checks.burned?'✓ It is ash, and fully out':'It is ash, and fully out'}</button></div>
  <p class="tiny">Only tick that when there is no glow left at all. This screen holds until you do, and it is holding you there on purpose.</p>`;
 }
},

/* ---------------------------------------------------------- 10 · FILL */
{id:'fill', name:'The Emptied Space', eyebrow:':43 — Fill', mins:7,
 render(){
  const today=new Date(EVENT.y,EVENT.m-1,EVENT.d);
  const iso=d=>d.toISOString().slice(0,10);
  const max=new Date(today.getTime()+7*864e5);
  const ok=(S.fill.space||'').trim()&&(S.fill.into||'').trim()&&(S.fill.feed||'').trim()&&S.fill.when;
  return `<h2>The step nearly everyone skips</h2>
  <p class="lede">Call <b>Wepwawet</b> now — Opener of the Ways, who goes at the head of the procession and clears the road ahead of everyone else. Then fill in the three lines below and <b>say them out loud</b>.</p>
  <div class="teach">
    <h4>Why this cannot be done silently</h4>
    <p>The space is empty and it will not stay empty. It fills with whatever is nearest, and what is nearest is the thing you just took out, because it knows the room and it knows the way back.</p>
    <p style="margin:0">So say what goes in. Say it where it can be heard — by whoever is beside you, or by the room if you are alone. A silent intention at this step is a gap left open, and something else will use it.</p>
  </div>
  <div class="field"><label>1 · The space that is now empty is —</label>
    <input class="inp" data-act="fill" data-k="space" value="${esc(S.fill.space||'')}" placeholder="the hours, the attention, the room in your week it occupied">
    <p class="tiny" style="margin-top:6px">Be concrete. "Thursday evenings." "The first hour of every morning." "The part of me that was always braced."</p></div>
  <div class="field"><label>2 · Into it goes —</label>
    <input class="inp" data-act="fill" data-k="into" value="${esc(S.fill.into||'')}" placeholder="one thing. Not a list.">
    <p class="tiny" style="margin-top:6px">A list is how the old thing gets back in. One thing.</p></div>
  <div class="field"><label>3 · I will feed it by —</label>
    <input class="inp" data-act="fill" data-k="feed" value="${esc(S.fill.feed||'')}" placeholder="one concrete action a witness could verify">
    <p class="tiny" style="margin-top:6px">Not "be kinder to myself." Something someone else could check.</p></div>
  <div class="field"><label>…and I will do that by —</label>
    <input class="inp" type="date" data-act="fill" data-k="when" value="${esc(S.fill.when||'')}" min="${iso(today)}" max="${iso(max)}">
    <p class="tiny" style="margin-top:6px">Inside seven days. Do not leave this screen without a date on it — an intention without a date is a wish, and wishes do not hold ground.</p></div>
  <div class="banner"><b>Check your answer to (2) before you say it.</b> If what goes in is a version of the thing you just burned — a better relationship of the same shape, a healthier version of the same job, the same arrangement with nicer people in it — go back and write something else. That is the old thing wearing a coat, and it is the single most common failure of release work. It will feel like progress right up until it doesn't.</div>
  ${ok?`<div class="card deep"><h4>Say this aloud, now</h4>
    <p style="font-size:1.1rem;font-style:italic;color:#f4eae0;margin:0">The space that is now empty is ${esc(S.fill.space)}. Into it goes ${esc(S.fill.into)}. I will feed it by ${esc(S.fill.feed)}, and I will do that by ${esc(new Date(S.fill.when+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}))}.</p>
    </div><div class="btnrow"><button class="btn sm" data-act="copyfill">Copy it</button></div>
    ${confirmBtn('fill','I have said all three out loud','Said out loud')}`:''}
  <div class="say">Opener of the Ways, who goes first and clears the road — the ground is bare now. Do not leave it bare. Open the way I named, and go ahead of me on it, so that what left tonight finds the road closed behind it.</div>`;
 }
},

/* ---------------------------------------------------------- 11 · BOAT WRITE */
{id:'boatwrite', name:'Writing & binding', eyebrow:':50 — The Boat', mins:10,
 render(){
  const side=S.checks.side;
  const bind=[['Wrap the strip round the outside of the four posts','Leave the top open. The lantern is a chimney, not a box.'],
   ['Tie off with cotton twine at the top','Natural fibre only. Nothing that melts.'],
   ['Tie again near the bottom','Snug, not crushing.'],
   ['Set the light in the middle, clear of the walls','Do not light it yet.']];
  const bl=bind.map((b,i)=>{const id='W'+i,on=S.checks[id];
    return `<div class="chk ${on?'done':''}" data-act="chk" data-id="${id}"><div class="box">✓</div>
      <div class="txt"><b>${esc(b[0])}</b>${esc(b[1])}</div></div>`;}).join('');
  return `<h2>The farewell — not the account</h2>
  <p class="lede">The parchment is ash. This is a different piece of writing and the difference is the whole point.</p>
  <div class="card"><h4>Keep the two apart</h4>
    <p><b>The parchment was the account</b> — the arrangement, the habit, your own part in it, named exactly. Ugly, specific, and gone to the fire.</p>
    <p style="margin:0"><b>The lantern paper is the farewell</b> — what you would say to the thing if it could hear you, and if you had finished being angry. Two lines is plenty. <i>Go well</i> is plenty. Obon does both: a working that is all fire and no farewell tends to bring the thing back in a new coat within the month.</p></div>
  <p>You have already told the truth about it and that page is ash. This one is different. This is the thing you would say if it could hear you and you were done being angry — which you may not be yet, and that is allowed. Write what you can reach tonight.</p>
  <div class="field"><label>Your farewell — draft it here, then write it on the paper by hand</label>
    <textarea class="inp" data-act="farewell" rows="3" placeholder="Go well…">${esc(S.farewell)}</textarea></div>
  <div class="field"><label>Which face?</label>
    <div class="toggle">
      <button data-act="side" data-v="in" class="${side==='in'?'on':''}">Inside — mine alone</button>
      <button data-act="side" data-v="out" class="${side==='out'?'on':''}">Outside — witnessed</button>
    </div>
    <p class="tiny" style="margin-top:8px">${side==='in'?'Written inward, it is read only by the light and by whatever is leaving.':side==='out'?'Written outward, it is read by the night and by anyone standing with you.':'Either is right. Choose deliberately rather than by default.'}</p></div>
  <p class="eyebrow" style="margin-top:24px">Binding</p>${bl}
  <div class="banner"><b>Do not light it yet.</b> The next screen holds until eight o'clock.</div>`;
 }
},

/* ---------------------------------------------------------- 12 · LAUNCH */
{id:'launch', name:'Eight o’clock', eyebrow:'The launch', mins:0,
 render(){
  const tz=myTZ();
  return `<h2>One push, and no more</h2>
  <div class="count" id="lc"><div class="lbl">Your launch — ${String(EVENT.hour).padStart(2,'0')}:00 local</div>
    <div class="clock" id="lcClock">—</div><div class="sub" id="lcSub"></div></div>
  <p class="lede">Take it outside. Light it, set it on the water, <b>give it a single push, and do not touch it again.</b> A river supplies the current; in a tub you supply it once and then you are done supplying it. That is the entire working.</p>
  <div class="banner"><b>If the wind parks it against the side, leave it.</b> Where it ends up is not yours to arrange any more. Everyone who reaches back in to straighten it will learn something about themselves.</div>
  <div class="say">One push. That is the last thing I do for this. Go well, and go all the way.</div>
  ${Date.now()<myLaunch().getTime()&&!S.preview
    ? `<div class="banner"><b>These do not open until eight.</b> That is the whole point of the relay — the chain only holds if everyone keeps the hour. Leave this page open, or close it and come back: your progress is kept on this device, so the working will be exactly where you left it.</div>`
    : ''}
  <div class="btnrow">
    <button class="btn ${S.lit?'':'primary'}" data-act="lit" ${Date.now()<myLaunch().getTime()&&!S.preview?'disabled':''}>${S.lit?'✓ Lit':'It is lit'}</button>
    <button class="btn ${S.pushed?'':'primary'}" data-act="pushed" ${(!S.lit||(Date.now()<myLaunch().getTime()&&!S.preview))?'disabled':''}>${S.pushed?'✓ Pushed — hands off':'One push given'}</button>
  </div>
  ${S.pushed?`<div class="card deep"><h4>Post your launch to the relay thread</h4>
    <p class="muted">City and local time, nothing more. The photo comes later, at your own dark.</p>
    <p style="font-family:var(--mono);font-size:.9rem;color:var(--gold);background:var(--panel2);padding:12px 14px;border-radius:3px">${esc(relayLine())}</p>
    <div class="btnrow" style="margin-bottom:0"><button class="btn sm" data-act="copyrelay">Copy for Discord</button></div></div>`:''}
  <div class="card"><h4>If it is not eight o'clock yet</h4>
  <p style="margin:0">Hold the boat and launch alone at your own eight — the circle will be open by then and that is intended. Keep this page; it will count down for you and tell you when.</p></div>`;
 },
 mount(){ tickers.launch=()=>{
   const L=myLaunch(), now=Date.now(), d=L-now, box=$('#lc'), c=$('#lcClock'), s=$('#lcSub');
   if(!c) return;

},

/* ---------------------------------------------------------- 13 · CLOSE */

/* ============================================================ LINES */
function relayLine(){
  const tz=myTZ(), city=S.place||tz.split('/').pop().replace(/_/g,' ');
  return city+' — '+String(EVENT.hour).padStart(2,'0')+':00 local — lit. One push given.';
}
function sittingLine(){
  const tz=myTZ(), city=S.place||tz.split('/').pop().replace(/_/g,' '), dk=darkToday();
  return city+' — sat with it at '+(dk?fmtLocal(dk,tz):'dark')+'. Didn’t touch it.';
}
function parchmentHTML(){
  const L=S.ladder;
  const line=(lab,v)=>v?`<div class="ln"><span>${esc(lab)}</span>${esc(v)}</div>`:'';
  return `<div class="parch">
    <h5>The account, as it actually was</h5>
    ${line('The arrangement',L.arrangement)}
    ${line('The recurring moment',L.moment)}
    ${line('What it paid me',L.payoff)}

  </div>
  <div class="btnrow"><button class="btn sm" data-act="copyparch">Copy the text</button>
  <button class="btn sm ghost" onclick="window.print()">Print it</button></div>
  <div class="banner"><b>Now write it out by hand, in red, on the parchment.</b> The typing was to find the words. The hand is what commits them. Rung one — the vague version — is deliberately left off: it was the wrapper, and it does not go to the fire.</div>`;
}
function parchmentText(){
  const L=S.ladder;
  return ['THE ACCOUNT, AS IT ACTUALLY WAS','',
    'The arrangement: '+(L.arrangement||''),
    'The recurring moment: '+(L.moment||''),

    'The sentence that kept it: '+(L.sentence||''),'',
    (L.closing||'This account is closed as of tonight.')].join('\n');
